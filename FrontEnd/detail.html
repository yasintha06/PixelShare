<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelShare | Detailed View</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --bg: #09090b;
            --surface: #18181b;
            --border: #27272a;
            --text: #f9fafb;
            --text-muted: #a1a1aa;
            --header-bg: rgba(9, 9, 11, 0.8);
            --radius: 20px;
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #000000;
            --text-muted: #333333;
            --header-bg: rgba(255, 255, 255, 0.85);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; transition: background 0.3s; }

        header {
            padding: 20px 40px; display: flex; align-items: center; gap: 20px;
            position: fixed; top: 0; width: 100%; background: var(--header-bg); backdrop-filter: blur(20px); z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); text-decoration: none; }
        .back-btn { background: var(--surface); padding: 12px; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--text); }

        .main-container {
            margin-top: 100px; padding: 20px 5%; display: flex; gap: 40px; min-height: calc(100vh - 100px);
        }


        /* Image Display */
        .image-side {
            flex: 1.5; position: relative; display: flex; align-items: center; justify-content: center;
            background: var(--surface); border-radius: var(--radius); overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.1);
        }
        .bg-blur {
            position: absolute; width: 120%; height: 120%; top: -10%; left: -10%;
            background-size: cover; background-position: center; filter: blur(60px) brightness(0.9); opacity: 0.3;
        }
        .main-img { max-width: 90%; max-height: 80vh; position: relative; z-index: 1; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }

        /* Content Side */
        .content-side {
            flex: 1; display: flex; flex-direction: column; gap: 32px; padding: 20px;
        }

        .user-block { display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: #ddd; border: 2px solid var(--primary); }
        .username { font-weight: 700; font-size: 1.1rem; }
        .follow-btn { background: var(--surface); color: var(--text); border: none; padding: 10px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; }

        .title-block h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 8px; }
        .location { color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }

        .description { line-height: 1.6; color: #444; font-size: 1.1rem; }

        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; background: var(--surface); padding: 24px; border-radius: 24px; }
        .meta-item label { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; margin-bottom: 4px; }
        .meta-item span { font-weight: 700; font-size: 1rem; }

        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { padding: 6px 14px; background: white; border: 1px solid var(--border); border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }

        .actions { display: flex; gap: 12px; margin-top: auto; }
        .btn { flex: 1; padding: 18px; border-radius: 20px; border: none; font-weight: 800; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-save { background: var(--primary); color: white; }
        .btn-save:hover { background: #ad001a; transform: translateY(-2px); }
        .btn-share { background: var(--surface); color: var(--text); }

        @media (max-width: 1100px) {
            .main-container { flex-direction: column; }
            .image-side { min-height: 50vh; }
        }
    </style>
</head>
<body>
    <script>document.body.setAttribute('data-theme', localStorage.getItem('pixelShareTheme') || 'dark');</script>
    <header>
        <a href="index.html" class="back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <a href="index.html" class="logo">PixelShare</a>
    </header>

    <div class="main-container">
        <div class="image-side">
            <div id="bgBlur" class="bg-blur"></div>
            <img id="mainImg" class="main-img" src="" alt="">
        </div>

        <div class="content-side">
            <div class="user-block">
                <div class="user-info">
                    <div class="avatar" id="creatorAvatar"></div>
                    <div>
                        <div class="username" id="photographer">@creator</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">1.2k followers</div>
                    </div>
                </div>
                <button class="follow-btn">Follow</button>
            </div>

            <div class="title-block">
                <h1 id="title">Image Title</h1>
                <div class="location">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    <span id="location">Location</span>
                </div>
            </div>

            <p class="description" id="description">This is a beautiful moment captured on camera.</p>

            <div class="meta-grid">
                <div class="meta-item"><label>Source</label><span id="source">Unknown</span></div>
                <div class="meta-item"><label>Copyright</label><span id="copyright">None</span></div>
                <div class="meta-item"><label>AI Generated</label><span id="aiGenerated">No</span></div>
                <div class="meta-item"><label>Format</label><span id="format">JPG</span></div>
                <div class="meta-item"><label>Resolution</label><span id="resolution">4k</span></div>
                <div class="meta-item"><label>Size</label><span id="size">2.4MB</span></div>
            </div>

            <div class="tags-section">
                <label style="display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; margin-bottom: 12px;">Related Tags</label>
                <div id="tags" class="tags-container"></div>
            </div>

            <div class="actions">
                <button class="btn btn-save" id="editBtn" onclick="toggleEdit()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    Edit Details
                </button>
                <button class="btn btn-share" id="deleteBtn" onclick="deletePhoto()" style="background: #ffeded; color: #e60023;">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    Delete Photo
                </button>
                <button class="btn btn-save" id="saveBtn" onclick="saveChanges()" style="display: none; background: #28a745;">
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <script>
        let photo = JSON.parse(localStorage.getItem('pixelShareCurrentView'));
        if (!photo) window.location.href = "index.html";

        let isEditing = false;
        const imgUrl = photo.ImageUrl || `/uploads/${photo.MediaID}${photo.FileExtension}`;

        function renderData() {
            document.getElementById('mainImg').src = imgUrl;
            document.getElementById('bgBlur').style.backgroundImage = `url(${imgUrl})`;
            document.getElementById('creatorAvatar').style.background = `url(${imgUrl}) center/cover`;
            
            document.getElementById('title').innerText = photo.Title || "Untitled masterpiece";
            document.getElementById('photographer').innerText = photo.Photographer || "anonymous";
            document.getElementById('location').innerText = photo.Location || "Earth";
            document.getElementById('description').innerText = photo.Description || "No description provided.";
            document.getElementById('source').innerText = photo.Source || "Unknown";
            document.getElementById('copyright').innerText = photo.Copyright || "None";
            document.getElementById('aiGenerated').innerText = photo.AiGenerated ? "Yes" : "No";
            document.getElementById('format').innerText = (photo.FileExtension || ".jpg").replace('.', '').toUpperCase();
            document.getElementById('resolution').innerText = photo.Resolution || "High Def";
            document.getElementById('size').innerText = (photo.FileSize_MB || "0") + "MB";

            const tagsContainer = document.getElementById('tags');
            tagsContainer.innerHTML = '';
            if (photo.Tags) {
                photo.Tags.split(',').forEach(tag => {
                    if (!tag.trim()) return;
                    const span = document.createElement('span');
                    span.className = 'tag';
                    span.innerText = '#' + tag.trim();
                    tagsContainer.appendChild(span);
                });
            }
        }

        function toggleEdit() {
            isEditing = !isEditing;
            const fields = ['title', 'location', 'description', 'source', 'copyright', 'tags'];
            
            if (isEditing) {
                fields.forEach(id => {
                    const el = document.getElementById(id);
                    const val = id === 'tags' ? photo.Tags : (id === 'source' ? photo.Source : (id === 'copyright' ? photo.Copyright : el.innerText));
                    el.innerHTML = `<input type="text" id="input_${id}" value="${val || ''}" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-family:inherit; font-size: inherit; color: var(--text); background: rgba(0,0,0,0.02); outline: none;">`;
                });
                
                const aiEl = document.getElementById('aiGenerated');
                const aiChecked = photo.AiGenerated ? "checked" : "";
                aiEl.innerHTML = `<input type="checkbox" id="input_aiGenerated" ${aiChecked} style="width: 20px; height: 20px; accent-color: var(--primary);">`;

                document.getElementById('editBtn').style.display = 'none';
                document.getElementById('saveBtn').style.display = 'flex';
            } else {
                renderData();
                document.getElementById('editBtn').style.display = 'flex';
                document.getElementById('saveBtn').style.display = 'none';
            }
        }

        async function saveChanges() {
            const updatedData = {
                Title: document.getElementById('input_title').value,
                Location: document.getElementById('input_location').value,
                Description: document.getElementById('input_description').value,
                Source: document.getElementById('input_source').value,
                Copyright: document.getElementById('input_copyright').value,
                Tags: document.getElementById('input_tags').value,
                AiGenerated: document.getElementById('input_aiGenerated').checked
            };

            try {
                const res = await fetch(`/api/photos/${photo.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });

                if (res.ok) {
                    const result = await res.json();
                    photo = result.item;
                    localStorage.setItem('pixelShareCurrentView', JSON.stringify(photo));
                    isEditing = false;
                    renderData();
                    document.getElementById('editBtn').style.display = 'flex';
                    document.getElementById('saveBtn').style.display = 'none';
                    alert("Changes saved to Cloud!");
                }
            } catch (err) {
                alert("Failed to save changes.");
            }
        }

        async function deletePhoto() {
            if (!confirm("Are you sure you want to delete this photo from the Cloud forever?")) return;

            try {
                const res = await fetch(`/api/photos/${photo.id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert("Deleted successfully!");
                    window.location.href = "index.html";
                }
            } catch (err) {
                alert("Delete failed.");
            }
        }

        function downloadImage() {
            const a = document.createElement('a');
            a.href = imgUrl;
            a.download = `PixelShare_${photo.MediaID}${photo.FileExtension}`;
            a.click();
        }

        renderData();
    </script>
</body>
</html>
