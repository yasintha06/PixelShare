<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelShare | Detail View</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #030712;
            --surface: rgba(30, 41, 59, 0.4);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        header {
            padding: 1rem 5%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }
        .logo { font-size: 1.6rem; font-weight: 800; text-decoration: none; color: white; }
        .logo span { color: var(--primary); }
        .nav-btn { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 10px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.9rem; }

        .main-content { display: flex; flex: 1; overflow: hidden; }

        .viewer { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; position: relative; padding: 40px; }
        .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); }

        .sidebar { width: 400px; background: var(--surface); backdrop-filter: blur(20px); border-left: 1px solid var(--border); padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 30px; }

        .info-header h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
        .info-header p { color: var(--text-muted); font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }

        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .meta-item label { display: block; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 4px; }
        .meta-item span { font-weight: 600; font-size: 0.95rem; }

        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { background: rgba(99, 102, 241, 0.1); color: var(--primary); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; border: 1px solid rgba(99, 102, 241, 0.2); }

        .action-group { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
        .btn-action { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1rem; }
        .btn-download { background: var(--primary); color: white; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2); }
        .btn-download:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4); }
        .btn-back { background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border); text-decoration: none; }
        .btn-back:hover { background: rgba(255,255,255,0.1); }

        @media (max-width: 1000px) {
            .main-content { flex-direction: column; overflow-y: auto; }
            .viewer { height: 60vh; flex: none; }
            .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); flex: none; }
            body { overflow: auto; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Pixel<span>Share</span></a>
        <a href="index.html" class="nav-btn">Back to Gallery</a>
    </header>

    <div class="main-content">
        <div class="viewer">
            <img id="mainImage" src="" alt="Masterpiece">
        </div>

        <aside class="sidebar">
            <div class="info-header">
                <h2 id="title">Image Title</h2>
                <p>📍 <span id="location">Location</span></p>
            </div>

            <div class="meta-grid">
                <div class="meta-item"><label>Photographer</label><span id="photographer">@username</span></div>
                <div class="meta-item"><label>Extension</label><span id="extension">JPG</span></div>
                <div class="meta-item"><label>Resolution</label><span id="resolution">0x0</span></div>
                <div class="meta-item"><label>Size</label><span id="size">0MB</span></div>
            </div>

            <div class="description-box">
                <label style="display: block; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 8px;">Description</label>
                <p id="description" style="color: var(--text-muted); line-height: 1.6; font-size: 0.95rem;">No description provided.</p>
            </div>

            <div class="tags-section">
                <label style="display: block; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 12px;">Tags</label>
                <div id="tags" class="tags-container"></div>
            </div>

            <div class="action-group">
                <button class="btn-action btn-download" onclick="downloadImage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download Original
                </button>
                <a href="index.html" class="btn-action btn-back">Return to Gallery</a>
            </div>
        </aside>
    </div>

    <script>
        const photoData = JSON.parse(localStorage.getItem('pixelShareCurrentView'));
        if (!photoData) window.location.href = "index.html";

        const imgUrl = photoData.ImageUrl || `/uploads/${photoData.MediaID}${photoData.FileExtension}`;

        document.getElementById('mainImage').src = imgUrl;
        document.getElementById('title').innerText = photoData.Title || "Untitled";
        document.getElementById('location').innerText = photoData.Location || "Unknown";
        document.getElementById('photographer').innerText = "@" + (photoData.Photographer || "anonymous");
        document.getElementById('extension').innerText = (photoData.FileExtension || ".jpg").toUpperCase().replace('.', '');
        document.getElementById('resolution').innerText = photoData.Resolution || "Unknown";
        document.getElementById('size').innerText = (photoData.FileSize_MB || "0") + "MB";
        document.getElementById('description').innerText = photoData.Description || "No description provided.";

        const tagsContainer = document.getElementById('tags');
        if (photoData.Tags) {
            photoData.Tags.split(',').forEach(tag => {
                if (!tag.trim()) return;
                const span = document.createElement('span');
                span.className = 'tag';
                span.innerText = '#' + tag.trim();
                tagsContainer.appendChild(span);
            });
        }

        function downloadImage() {
            const a = document.createElement('a');
            a.href = imgUrl;
            a.download = `PixelShare_${photoData.MediaID}${photoData.FileExtension}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
