<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelShare | Create</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --bg: #09090b;
            --surface: #18181b;
            --border: #27272a;
            --text: #f9fafb;
            --text-muted: #a1a1aa;
            --radius: 20px;
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #000000;
            --text-muted: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s; }

        header { padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); text-decoration: none; }
        .cancel-btn { color: var(--text); text-decoration: none; font-weight: 600; font-size: 0.9rem; }

        .studio-container {
            max-width: 1100px; margin: 100px auto 60px; display: flex; gap: 60px; padding: 0 40px; align-items: flex-start;
        }

        .upload-side {
            flex: 1; position: sticky; top: 120px;
        }

        /* Uploader Area */
        .upload-area {
            width: 100%; aspect-ratio: 4/5; background: var(--surface); border-radius: var(--radius);
            border: 2px dashed var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; transition: 0.3s;
        }
        .upload-area:hover { border-color: var(--primary); }
        .upload-area input[type="file"] { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        .upload-icon { font-size: 3rem; margin-bottom: 16px; }
        .upload-hint { color: var(--text-muted); font-weight: 600; text-align: center; max-width: 200px; font-size: 0.9rem; }
        .upload-subhint { color: var(--text-muted); font-size: 0.75rem; margin-top: 10px; opacity: 0.7; text-align: center; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

        .preview-img { width: 100%; height: 100%; object-fit: contain; border-radius: calc(var(--radius) - 2px); display: none; background: rgba(0,0,0,0.03); padding: 10px; }

        /* Form Area */
        .form-area { flex: 1.5; display: flex; flex-direction: column; gap: 24px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group.full { grid-column: 1 / -1; }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
        .form-group.row { flex-direction: row; align-items: center; justify-content: space-between; padding: 0 10px; }
        label { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        input[type="text"], textarea, select {
            padding: 16px 20px; border: 1px solid var(--border); background: rgba(0,0,0,0.02);
            border-radius: 12px; font-family: inherit; font-size: 1rem; font-weight: 500; outline: none; transition: 0.3s; color: var(--text);
            width: 100%;
        }
        [data-theme="dark"] input[type="text"], [data-theme="dark"] textarea, [data-theme="dark"] select { background: rgba(255,255,255,0.03); }
        input[type="text"]:focus, textarea:focus, select:focus { border-color: var(--primary); background: transparent; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); }
        textarea { height: 120px; resize: none; }
        select { cursor: pointer; }
        select option { background: var(--surface); color: var(--text); }

        .btn-publish {
            background: var(--primary); color: #000; border: none; padding: 20px; border-radius: 30px;
            font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-top: 10px; width: 100%;
        }
        .btn-publish:hover { background: #059669; transform: scale(1.02); }
        .btn-publish:disabled { background: var(--border); cursor: not-allowed; }

        @media (max-width: 800px) {
            .studio-container { flex-direction: column; }
            .form-grid { grid-template-columns: 1fr; }
            .upload-side { position: relative; top: 0; }
        }
    </style>
</head>
<body>
    <script>document.body.setAttribute('data-theme', localStorage.getItem('pixelShareTheme') || 'dark');</script>
    <header>
        <a href="index.html" class="logo">PixelShare</a>
        <a href="index.html" class="cancel-btn">Discard</a>
    </header>

    <div class="studio-container">
        <div class="upload-side">
            <div class="upload-area" id="dropZone">
                <input type="file" id="fileInput" accept="image/*">
                <img id="preview" class="preview-img" alt="Preview">
                <div id="uploadPlaceholder">
                    <div class="upload-icon">🎨</div>
                    <p class="upload-hint">Drag and drop or click to upload your masterpiece</p>
                    <p class="upload-subhint">JPG, PNG, WEBP (Max 50MB)</p>
                </div>
            </div>
        </div>

        <form class="form-area" id="uploadForm">
            <div class="form-grid">
                <div class="form-group full">
                    <label>Title</label>
                    <input type="text" id="title" placeholder="Give your photo a name" required>
                </div>

                <div class="form-group full">
                    <label>The Story</label>
                    <textarea id="description" placeholder="What is the story behind this shot?"></textarea>
                </div>

                <div class="form-group">
                    <label>Creator</label>
                    <input type="text" id="photographer" placeholder="@yourname" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="tags" required>
                        <option value="" disabled selected>Select a category</option>
                        <option value="Nature">Nature</option>
                        <option value="Architecture">Architecture</option>
                        <option value="Technology">Technology</option>
                        <option value="Travel">Travel</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location" placeholder="Where was this taken?">
                </div>

                <div class="form-group">
                    <label>Source</label>
                    <input type="text" id="source" placeholder="Camera Model, Lens, etc.">
                </div>

                <div class="form-group">
                    <label>Copyright</label>
                    <input type="text" id="copyright" placeholder="e.g. © 2026 Your Name">
                </div>

                <div class="form-group row">
                    <label>AI Generated?</label>
                    <input type="checkbox" id="aiGenerated" style="width: 24px; height: 24px; accent-color: var(--primary);">
                </div>
            </div>

            <button type="submit" class="btn-publish" id="publishBtn">Publish to Community</button>
        </form>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const placeholder = document.getElementById('uploadPlaceholder');
        const publishBtn = document.getElementById('publishBtn');

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                    placeholder.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const file = fileInput.files[0];
            if (!file) {
                alert("Please select a photo first!");
                return;
            }

            publishBtn.disabled = true;
            publishBtn.innerText = "Publishing...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64Image = reader.result;
                const extension = "." + file.name.split('.').pop();
                
                const bodyData = {
                    title: document.getElementById('title').value,
                    description: document.getElementById('description').value,
                    photographer: document.getElementById('photographer').value,
                    location: document.getElementById('location').value,
                    tags: document.getElementById('tags').value,
                    source: document.getElementById('source').value,
                    copyright: document.getElementById('copyright').value,
                    aiGenerated: document.getElementById('aiGenerated').checked,
                    img: base64Image,
                    extension: extension,
                    resolution: "Unknown",
                    sizeMB: (file.size / (1024 * 1024)).toFixed(2)
                };

                try {
                    const res = await fetch('/api/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(bodyData)
                    });

                    if (res.ok) {
                        window.location.href = "index.html";
                    } else {
                        alert("Upload failed. Please check your connection.");
                        publishBtn.disabled = false;
                        publishBtn.innerText = "Publish to Community";
                    }
                } catch (err) {
                    console.error("Upload error:", err);
                    alert("Server error. Please try again later.");
                    publishBtn.disabled = false;
                }
            };
        };
    </script>
</body>
</html>
