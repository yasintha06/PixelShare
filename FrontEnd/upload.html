<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PixelShare - Upload</title>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        
        header { background: var(--card); padding: 20px; text-align: center; border-bottom: 2px solid var(--primary); }
        header h1 { margin: 0; color: var(--primary); }
        nav { margin-top: 10px; }
        nav a { color: var(--text); text-decoration: none; margin: 0 15px; font-weight: bold; }

        .upload-container { background: var(--card); padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; margin: 30px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-top: 0; }
        
        /* Drag and Drop Area Styles */
        .drop-zone { 
            border: 2px dashed var(--primary); 
            padding: 25px; 
            text-align: center; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-bottom: 20px; 
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .drop-zone.drag-over { background: rgba(99, 102, 241, 0.2); border-color: #ffffff; }
        
        /* Image Preview Style */
        #previewImg { 
            max-width: 100%; 
            max-height: 200px; 
            display: none; 
            border-radius: 4px; 
            margin-top: 10px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: #94a3b8; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }

        .ai-container { display: flex; align-items: center; justify-content: space-between; background: rgba(99, 102, 241, 0.1); padding: 12px; border-radius: 8px; border: 1px solid var(--primary); margin: 15px 0; }
        .switch { position: relative; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #334155; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        .btn-submit { width: 100%; padding: 14px; background: #334155; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: not-allowed; transition: 0.3s; }
        .btn-submit.active { background: var(--primary); cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>PixelShare</h1>
        <nav><a href="index.html">Home</a><a href="upload.html" style="color: var(--primary);">Upload</a></nav>
    </header>

    <div class="upload-container">
        <h2>Upload New Media</h2>
        
        <div class="drop-zone" id="dropZone">
            <div id="dropContent">
                <span id="icon" style="font-size: 2.5rem;">☁️</span><br>
                <strong id="infoText">Drag & Drop or Click to select</strong>
            </div>
            <img id="previewImg" src="" alt="Preview">
            <input type="file" id="fileInput" accept="image/jpeg, image/jpg, image/png" style="display: none;">
        </div>

        <div class="form-group"><label>Title</label><input type="text" id="titleInput"></div>
        <div class="form-group"><label>Location</label><input type="text" id="locationInput"></div>
        <div class="form-group"><label>Description</label><textarea id="descriptionInput" rows="2"></textarea></div>
        <div class="form-group"><label>Tags</label><input type="text" id="tagsInput" placeholder="tag1, tag2"></div>
        <div class="form-group"><label>Photographer</label><input type="text" id="photographerInput"></div>
        <div class="form-group"><label>Source</label><input type="text" id="sourceInput"></div>
        <div class="form-group"><label>Copyright</label><input type="text" id="copyrightInput"></div>
        
        <div class="ai-container">
            <span>🤖 AI Generated?</span>
            <label class="switch"><input type="checkbox" id="aiToggle"><span class="slider"></span></label>
        </div>

        <button class="btn-submit" id="submitBtn" onclick="publishPhoto()" disabled>Select a valid file</button>
        <p style="text-align:center; font-size:0.7rem; color:#94a3b8; margin-top:10px;">JPG or PNG | Max 50MB</p>
    </div>

    <script>
        let uploadedImg = "";
        let meta = {};
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const dropContent = document.getElementById('dropContent');
        const btn = document.getElementById('submitBtn');

        // Trigger file input when clicking the zone
        dropZone.addEventListener('click', () => fileInput.click());

        // Handle Drag Over
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        // Handle Drag Leave
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        // Handle Drop
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFile(files[0]);
        });

        // Handle Select
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (!['jpg', 'jpeg', 'png'].includes(ext)) {
                alert("Only JPG or PNG files are allowed!");
                return;
            }

            const size = (file.size / (1024 * 1024)).toFixed(2);
            if (size > 50) {
                alert("File is too large! Max 50MB.");
                return;
            }

            const reader = new FileReader();
            reader.onload = (ev) => {
                uploadedImg = ev.target.result;
                
                // Show Preview & Hide Icon
                previewImg.src = uploadedImg;
                previewImg.style.display = 'block';
                dropContent.style.display = 'none';

                // Activate Button
                btn.disabled = false;
                btn.classList.add('active');
                btn.innerText = `Publish Photo (${size}MB)`;

                // Store technical metadata
                const i = new Image();
                i.onload = () => { 
                    meta = { ext: "."+ext, res: `${i.width}x${i.height}`, size: size }; 
                };
                i.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function publishPhoto() {
            btn.disabled = true;
            btn.innerText = "Saving to Cloud...";

            const payload = {
                title: document.getElementById('titleInput').value || "Untitled",
                location: document.getElementById('locationInput').value || "Unknown",
                description: document.getElementById('descriptionInput').value || "",
                tags: document.getElementById('tagsInput').value || "",
                photographer: document.getElementById('photographerInput').value || "Anonymous",
                source: document.getElementById('sourceInput').value || "Personal",
                copyright: document.getElementById('copyrightInput').value || "© 2026",
                aiGenerated: document.getElementById('aiToggle').checked ? "Yes" : "No",
                img: uploadedImg,
                extension: meta.ext,
                resolution: meta.res,
                sizeMB: meta.size
            };

            const res = await fetch('/api/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) window.location.href = "index.html";
            else alert("Error uploading photo.");
        }
    </script>
</body>
</html>
