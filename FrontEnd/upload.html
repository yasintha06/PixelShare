<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelShare | Upload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #030712;
            --surface: rgba(30, 41, 59, 0.4);
            --surface-hover: rgba(30, 41, 59, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        /* Background Blob */
        .blob { position: fixed; width: 600px; height: 600px; background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%); filter: blur(80px); z-index: -1; top: 10%; left: 50%; transform: translateX(-50%); }

        header {
            padding: 1.2rem 5%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.6rem; font-weight: 800; text-decoration: none; color: white; }
        .logo span { color: var(--primary); }
        nav a { color: var(--text-muted); text-decoration: none; margin-left: 20px; font-weight: 600; transition: color 0.3s; }
        nav a:hover { color: white; }

        .container { max-width: 600px; margin: 60px auto; padding: 0 20px; }

        .upload-card {
            background: var(--surface); backdrop-filter: blur(20px); border: 1px solid var(--border);
            padding: 40px; border-radius: 32px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h2 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; text-align: center; }
        .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 32px; font-size: 0.95rem; }

        /* Drop Zone */
        .drop-zone {
            height: 200px; border: 2px dashed var(--border); border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden;
            background: rgba(255,255,255,0.02);
        }
        .drop-zone:hover { border-color: var(--primary); background: rgba(99, 102, 241, 0.05); }
        .drop-zone.drag-over { border-color: var(--primary); background: rgba(99, 102, 241, 0.1); transform: scale(1.02); }
        
        #previewImg { width: 100%; height: 100%; object-fit: cover; display: none; }
        .drop-content { text-align: center; }
        .drop-content svg { color: var(--primary); margin-bottom: 12px; }

        /* Form Grid */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group.full { grid-column: span 2; }
        
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        input, textarea {
            width: 100%; padding: 14px 18px; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
            border-radius: 12px; color: white; font-family: inherit; font-size: 0.95rem; outline: none; transition: all 0.3s;
        }
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2); }

        .ai-badge {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(99, 102, 241, 0.1); padding: 15px 20px; border-radius: 16px; border: 1px solid rgba(99, 102, 241, 0.2);
            margin: 10px 0 30px;
        }

        /* Toggle Switch */
        .switch { position: relative; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        .submit-btn {
            width: 100%; padding: 18px; background: #1e293b; color: white; border: none; border-radius: 16px;
            font-size: 1.1rem; font-weight: 700; cursor: not-allowed; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .submit-btn.active { background: var(--primary); cursor: pointer; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
        .submit-btn.active:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body>
    <div class="blob"></div>

    <header>
        <a href="index.html" class="logo">Pixel<span>Share</span></a>
        <nav><a href="index.html">Gallery</a><a href="upload.html" style="color: white;">Upload</a></nav>
    </header>

    <div class="container">
        <div class="upload-card">
            <h2>Share Vision</h2>
            <p class="subtitle">Upload your masterpiece to the global Azure cloud.</p>

            <div class="drop-zone" id="dropZone">
                <div class="drop-content" id="dropContent">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <p style="font-weight: 600;">Drag or click to upload</p>
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">JPG, PNG up to 50MB</p>
                </div>
                <img id="previewImg" src="" alt="Preview">
                <input type="file" id="fileInput" accept="image/jpeg, image/jpg, image/png" style="display: none;">
            </div>

            <div class="form-grid">
                <div class="form-group full"><label>Title</label><input type="text" id="titleInput" placeholder="Morning Mist"></div>
                <div class="form-group"><label>Location</label><input type="text" id="locationInput" placeholder="Swiss Alps"></div>
                <div class="form-group"><label>Photographer</label><input type="text" id="photographerInput" placeholder="@username"></div>
                <div class="form-group full"><label>Description</label><textarea id="descriptionInput" rows="3" placeholder="Tell the story behind this shot..."></textarea></div>
                <div class="form-group"><label>Tags</label><input type="text" id="tagsInput" placeholder="Nature, Landscape"></div>
                <div class="form-group"><label>Copyright</label><input type="text" id="copyrightInput" value="© 2026 PixelShare"></div>
            </div>

            <div class="ai-badge">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 1.2rem;">🤖</span>
                    <span style="font-weight: 600;">AI Generated?</span>
                </div>
                <label class="switch"><input type="checkbox" id="aiToggle"><span class="slider"></span></label>
            </div>

            <button class="submit-btn" id="submitBtn" onclick="publishPhoto()" disabled>Select a file to begin</button>
        </div>
    </div>

    <script>
        let uploadedImg = "";
        let meta = {};
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const dropContent = document.getElementById('dropContent');
        const btn = document.getElementById('submitBtn');

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); };
        dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
        dropZone.ondrop = (e) => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); };
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file) return;
            const ext = "." + file.name.split('.').pop().toLowerCase();
            const size = (file.size / (1024 * 1024)).toFixed(2);

            const reader = new FileReader();
            reader.onload = (ev) => {
                uploadedImg = ev.target.result;
                previewImg.src = uploadedImg;
                previewImg.style.display = 'block';
                dropContent.style.display = 'none';
                btn.disabled = false;
                btn.classList.add('active');
                btn.innerText = `Publish Masterpiece (${size}MB)`;

                const i = new Image();
                i.onload = () => { meta = { ext, res: `${i.width}x${i.height}`, size }; };
                i.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function publishPhoto() {
            btn.disabled = true;
            btn.innerText = "Scaling to Cloud...";

            const payload = {
                title: document.getElementById('titleInput').value || "Untitled",
                location: document.getElementById('locationInput').value || "Unknown",
                description: document.getElementById('descriptionInput').value || "",
                tags: document.getElementById('tagsInput').value || "",
                photographer: document.getElementById('photographerInput').value || "Anonymous",
                source: "Web Client",
                copyright: document.getElementById('copyrightInput').value,
                aiGenerated: document.getElementById('aiToggle').checked ? "Yes" : "No",
                img: uploadedImg,
                extension: meta.ext,
                resolution: meta.res,
                sizeMB: meta.size
            };

            const res = await fetch('/api/upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) window.location.href = "index.html";
            else alert("Upload failed. Check Azure logs.");
        }
    </script>
</body>
</html>
