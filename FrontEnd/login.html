<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelShare | Access Cloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #030712;
            --surface: rgba(30, 41, 59, 0.4);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        /* Abstract Glows */
        .blob { position: fixed; width: 600px; height: 600px; background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%); filter: blur(80px); z-index: -1; }
        .blob-1 { top: -200px; left: -100px; }
        .blob-2 { bottom: -200px; right: -100px; background: radial-gradient(circle, #8b5cf6 0%, transparent 70%); }

        .login-card {
            width: 400px; background: var(--surface); backdrop-filter: blur(24px);
            border: 1px solid var(--border); border-radius: 32px; padding: 50px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo { font-size: 2.2rem; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 8px; background: linear-gradient(to right, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 40px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; margin-left: 4px; }
        input { width: 100%; padding: 16px 20px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 16px; color: white; font-family: inherit; font-size: 1rem; outline: none; transition: all 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2); }

        .btn-signin { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 16px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; transition: all 0.3s; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2); }
        .btn-signin:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4); background: #4f46e5; }

        .footer-links { margin-top: 30px; font-size: 0.85rem; color: var(--text-muted); }
        .footer-links a { color: var(--primary); text-decoration: none; font-weight: 600; margin: 0 10px; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-card">
        <div class="logo">PixelShare</div>
        <p class="subtitle">Welcome back to the creative cloud.</p>

        <form action="index.html">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@domain.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-signin">Sign In to Dashboard</button>
        </form>

        <div class="footer-links">
            <a href="#">Forgot Password?</a>
            <span>•</span>
            <a href="#">Join Community</a>
        </div>
    </div>
</body>
</html>
