<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - PixelShare</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif; background-color: #f4f4f4;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
        }
        .login-card {
            background: white; padding: 2.5rem; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 350px; text-align: center;
        }
        .logo { font-size: 1.8rem; font-weight: bold; color: #333; margin-bottom: 0.5rem; }
        .subtitle { color: #666; margin-bottom: 2rem; font-size: 0.9rem; }
        input {
            width: 100%; padding: 12px; margin-bottom: 1rem; border: 1px solid #ddd;
            border-radius: 6px; box-sizing: border-box;
        }
        .btn-primary {
            width: 100%; padding: 12px; background-color: #0078d4; color: white;
            border: none; border-radius: 6px; font-weight: 600; cursor: pointer;
        }
        .btn-primary:hover { background-color: #005a9e; }
        .links { margin-top: 1.5rem; font-size: 0.85rem; }
        .links a { color: #0078d4; text-decoration: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">PixelShare</div>
        <div class="subtitle">Welcome back to the creative cloud.</div>

        <form action="index.html">
            <input type="email" placeholder="user@example.com" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="links">
            <a href="#">Forgot Password?</a> | <a href="#">Create Account</a>
        </div>
    </div>

</body>
</html>
