<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelShare | Join the Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --bg: #09090b;
            --surface: #18181b;
            --border: #27272a;
            --text: #f9fafb;
            --text-muted: #a1a1aa;
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #000000;
            --text-muted: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        .auth-container {
            width: 100%; max-width: 450px; padding: 40px; text-align: center;
        }

        .logo { font-size: 2.5rem; font-weight: 800; color: var(--primary); margin-bottom: 8px; text-decoration: none; display: inline-block; }
        .subtitle { font-size: 1.5rem; font-weight: 600; margin-bottom: 40px; color: var(--text-muted); }

        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; margin-left: 12px; color: var(--text-muted); }
        input {
            width: 100%; padding: 16px 20px; border-radius: 12px; border: 1px solid var(--border);
            font-family: inherit; font-size: 1rem; font-weight: 600; outline: none; transition: 0.3s;
            background: rgba(0,0,0,0.02); color: var(--text);
        }
        [data-theme="dark"] input { background: rgba(255,255,255,0.03); }
        input:focus { border-color: var(--primary); background: transparent; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); }

        .btn-auth {
            width: 100%; padding: 16px; background: var(--primary); color: #000; border: none;
            border-radius: 30px; font-weight: 800; font-size: 1.1rem; cursor: pointer; margin-top: 20px;
            transition: 0.3s;
        }
        .btn-auth:hover { background: #059669; transform: translateY(-2px); }

        .divider { margin: 30px 0; color: var(--text-muted); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .footer-links { color: var(--text-muted); font-size: 0.85rem; margin-top: 20px; font-weight: 600; }
        .footer-links a { color: var(--text); text-decoration: none; border-bottom: 2px solid var(--primary); }

        /* Background Graphics */
        .bg-circle { position: fixed; border-radius: 50%; background: var(--surface); z-index: -1; }
        .c1 { width: 400px; height: 400px; top: -100px; left: -100px; }
        .c2 { width: 300px; height: 300px; bottom: -50px; right: -50px; background: #fff5f6; }
    </style>
</head>
<body>
    <script>document.body.setAttribute('data-theme', localStorage.getItem('pixelShareTheme') || 'dark');</script>
    <div class="bg-circle c1"></div>
    <div class="bg-circle c2"></div>

    <div class="auth-container">
        <a href="index.html" class="logo">PixelShare</a>
        <h2 class="subtitle">Welcome to the creative community.</h2>

        <form action="index.html">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-auth">Sign In</button>
        </form>

        <div class="divider">OR</div>

        <div class="footer-links">
            Don't have an account? <a href="#">Join now</a>
        </div>
        <div class="footer-links" style="margin-top: 40px; font-size: 0.75rem;">
            By continuing, you agree to PixelShare's **Terms of Service** and **Privacy Policy**.
        </div>
    </div>
</body>
</html>
