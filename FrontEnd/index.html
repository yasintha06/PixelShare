<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelShare | Discover & Share</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --bg: #030712;
            --surface: rgba(30, 41, 59, 0.5);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Abstract Background Glows */
        .blob {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
        }
        .blob-1 { top: -200px; left: -100px; }
        .blob-2 { bottom: -200px; right: -100px; background: radial-gradient(circle, #8b5cf6 0%, transparent 70%); }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--surface-border);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-actions { display: flex; align-items: center; gap: 20px; }

        .btn-upload {
            background: var(--primary);
            color: white;
            padding: 0.8rem 1.6rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px var(--primary-glow);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--primary-glow);
            background: #4f46e5;
        }

        .profile-trigger {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            border: 2px solid var(--surface-border);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .profile-trigger:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        /* Hero Section */
        .hero {
            padding: 180px 5% 100px;
            text-align: center;
            position: relative;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -2px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 3rem;
        }

        .search-container {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 1.5rem 2rem 1.5rem 3.5rem;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-container input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        /* Filters */
        .filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 2rem 5%;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.7rem 1.5rem;
            border-radius: 30px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }

        .filter-btn.active {
            background: white;
            color: var(--bg);
            border-color: white;
        }

        /* Gallery */
        .gallery-section {
            padding: 2rem 5% 100px;
            max-width: 1800px;
            margin: 0 auto;
        }

        .masonry {
            column-count: 4;
            column-gap: 24px;
        }

        .card {
            background: var(--surface);
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 24px;
            break-inside: avoid;
            border: 1px solid var(--surface-border);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            transform: scale(1.02);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .card img {
            width: 100%;
            display: block;
            transition: transform 0.6s ease;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card:hover .card-overlay { opacity: 1; }

        .author { font-weight: 600; font-size: 0.9rem; }
        .stats { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; color: #cbd5e1; }

        @media (max-width: 1200px) { .masonry { column-count: 3; } }
        @media (max-width: 900px) { .masonry { column-count: 2; } }
        @media (max-width: 600px) { .masonry { column-count: 1; } }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <header>
        <div class="logo">PixelShare</div>
        <div class="nav-actions">
            <a href="upload.html" class="btn-upload">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Upload
            </a>
            <a href="login.html" class="profile-trigger">
                <img src="https://ui-avatars.com/api/?name=User&background=1e293b&color=f8fafc&bold=true" alt="Profile" style="width: 100%; height: 100%; object-fit: cover;">
            </a>
        </div>
    </header>

    <section class="hero">
        <h1>Canvas for <br><span style="color: var(--primary)">Cloud Creators</span></h1>
        <p>A high-performance photo community powered by Azure. Discover, share, and scale your vision.</p>
        
        <div class="search-container">
            <svg style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-muted)" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Search high-resolution images..." onkeyup="filterBySearch()">
        </div>
    </section>

    <div class="filters">
        <button class="filter-btn active" onclick="filterGallery('All', this)">All Collections</button>
        <button class="filter-btn" onclick="filterGallery('Nature', this)">Nature</button>
        <button class="filter-btn" onclick="filterGallery('Style', this)">Style</button>
        <button class="filter-btn" onclick="filterGallery('Urban', this)">Urban</button>
        <button class="filter-btn" onclick="filterGallery('Other', this)">Other</button>
    </div>

    <main class="gallery-section">
        <div class="masonry" id="photo-grid">
            <!-- Dynamic Content -->
        </div>
    </main>

    <script>
        let currentDatabase = [];

        async function fetchPhotos() {
            try {
                const response = await fetch('/api/photos');
                currentDatabase = await response.json();
                renderPhotos(currentDatabase);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('photo-grid').innerHTML = `<p style="text-align:center; grid-column: 1/-1">Failed to connect to Azure. Please check your deployment.</p>`;
            }
        }

        function renderPhotos(photos) {
            const grid = document.getElementById('photo-grid');
            grid.innerHTML = '';
            
            if (photos.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); text-align: center; width: 100%">No masterpieces found yet.</p>';
                return;
            }

            photos.forEach(photo => {
                const imageUrl = photo.ImageUrl || `/uploads/${photo.MediaID}${photo.FileExtension}`;
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openDetail(photo);
                card.innerHTML = `
                    <img src="${imageUrl}" alt="${photo.Title}">
                    <div class="card-overlay">
                        <span class="author">@${photo.Photographer || 'anonymous'}</span>
                        <div class="stats">
                            <span>🔥 12</span>
                            <span>📁 ${photo.FileExtension.toUpperCase().replace('.', '')}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openDetail(photo) {
            localStorage.setItem('pixelShareCurrentView', JSON.stringify(photo));
            window.location.href = "detail.html";
        }

        function filterGallery(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const filtered = category === 'All' 
                ? currentDatabase 
                : currentDatabase.filter(p => p.Tags.includes(category) || p.Category === category);
            renderPhotos(filtered);
        }

        function filterBySearch() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = currentDatabase.filter(p => 
                p.Title.toLowerCase().includes(term) || 
                p.Description.toLowerCase().includes(term) ||
                p.Tags.toLowerCase().includes(term)
            );
            renderPhotos(filtered);
        }

        window.onload = fetchPhotos;
    </script>
</body>
</html>
