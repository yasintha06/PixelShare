<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelShare | Discover Inspiration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981; /* Vibrant Emerald */
            --primary-hover: #059669;
            --bg: #09090b; /* Near Black */
            --surface: #18181b; /* Solid surface instead of glass for cards */
            --surface-hover: #27272a;
            --border: #3f3f46;
            --text: #f9fafb;
            --text-muted: #9ca3af;
            --header-bg: rgba(9, 9, 11, 0.8);
            --radius: 16px;
        }

        [data-theme="light"] {
            --bg: #f8fafc; /* Very light slate */
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --border: #e2e8f0;
            --text: #000000; /* Pure black for maximum contrast */
            --text-muted: #333333; /* Darker muted text */
            --header-bg: rgba(255, 255, 255, 0.85);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; transition: background 0.3s, color 0.3s; }

        /* Modern Glass Header */
        header {
            position: fixed; top: 0; width: 100%; height: 80px; 
            background: var(--header-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: space-between; padding: 0 40px; z-index: 1000;
            border-bottom: 1px solid var(--border);
            transition: background 0.3s, border-color 0.3s;
        }
        
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 12px; letter-spacing: -0.5px;}
        .logo svg { color: var(--primary); }
        
        .search-bar {
            flex: 0 1 500px; position: relative;
        }
        .search-bar input {
            width: 100%; padding: 14px 24px 14px 48px; border-radius: 30px;
            border: 1px solid var(--border); background: var(--surface); color: var(--text);
            font-size: 0.95rem; outline: none; transition: 0.3s;
        }
        .search-bar input:focus { border-color: var(--primary); background: rgba(255,255,255,0.06); }
        .search-bar svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .nav-actions { display: flex; align-items: center; gap: 16px; }
        .btn { padding: 12px 24px; border-radius: 30px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; font-size: 0.95rem; transition: 0.3s; }
        .btn-upload { background: var(--primary); color: #000; }
        .btn-upload:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-icon { background: var(--surface); color: var(--text); padding: 12px; border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
        .btn-icon:hover { background: var(--surface-hover); }

        /* Filter Pills */
        .categories {
            margin-top: 110px; display: flex; justify-content: center; gap: 12px; padding: 0 20px; overflow-x: auto;
        }
        .cat-pill { padding: 10px 24px; background: transparent; border: 1px solid var(--border); border-radius: 30px; font-weight: 600; cursor: pointer; white-space: nowrap; font-size: 0.9rem; transition: 0.3s; color: var(--text-muted); }
        .cat-pill.active { background: var(--text); color: var(--bg); border-color: var(--text); }
        .cat-pill:hover:not(.active) { border-color: var(--text-muted); color: var(--text); }

        /* Modern Grid */
        .gallery-container { padding: 40px; max-width: 1600px; margin: 0 auto; }
        .masonry {
            columns: 4 300px; column-gap: 24px; width: 100%;
        }

        .photo-card {
            break-inside: avoid; margin-bottom: 24px; position: relative;
            border-radius: var(--radius); overflow: hidden; cursor: zoom-in;
            background: var(--surface); border: 1px solid var(--border);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .photo-card:hover { transform: translateY(-8px); border-color: var(--primary); }
        
        .photo-card img {
            width: 100%; display: block; border-bottom: 1px solid var(--border);
            transition: opacity 0.3s;
        }
        
        .card-info { padding: 16px; display: flex; justify-content: space-between; align-items: center; background: transparent; }
        .card-title { font-weight: 600; font-size: 0.95rem; color: var(--text); }
        .card-author { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        
        /* Empty State */
        #emptyState { text-align: center; padding: 120px 0; display: none; }
        
        @media (max-width: 900px) {
            .masonry { columns: 2 200px; }
            header { padding: 0 20px; }
            .search-bar { display: none; } /* Hide search on mobile for clean look */
            .logo span { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <span>PixelShare</span>
        </a>
        
        <div class="search-bar">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Search for nature, cities, architecture...">
        </div>

        <div class="nav-actions">
            <a href="upload.html" class="btn btn-upload">Create</a>
            <button class="btn btn-icon" id="themeToggle">🌓</button>
            <a href="login.html" class="btn btn-icon">👤</a>
        </div>
    </header>

    <div class="categories">
        <div class="cat-pill active">All</div>
        <div class="cat-pill">Nature</div>
        <div class="cat-pill">Architecture</div>
        <div class="cat-pill">Technology</div>
        <div class="cat-pill">Travel</div>
        <div class="cat-pill">People</div>
        <div class="cat-pill">Other</div>
    </div>

    <main class="gallery-container">
        <div id="gallery" class="masonry">
            <!-- Dynamic Content -->
        </div>

        <div id="emptyState">
            <h2 style="font-size: 2rem; margin-bottom: 12px;">Start your collection</h2>
            <p style="color: var(--text-muted); margin-bottom: 24px;">Follow creators or upload your own masterpieces.</p>
            <a href="upload.html" class="btn btn-upload">Upload your first photo</a>
        </div>
    </main>

    <script>
        async function loadGallery() {
            const gallery = document.getElementById('gallery');
            const emptyState = document.getElementById('emptyState');
            
            try {
                const res = await fetch('/api/photos');
                const photos = await res.json();

                if (!photos || photos.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }

                gallery.innerHTML = photos.map(photo => {
                    const imgUrl = photo.ImageUrl || `/uploads/${photo.MediaID}${photo.FileExtension}`;
                    return `
                        <div class="photo-card" data-tags="${photo.Tags || ''}" onclick="viewDetail(${JSON.stringify(photo).replace(/"/g, '&quot;')})">
                            <img src="${imgUrl}" alt="${photo.Title}">
                            <div class="card-info">
                                <div>
                                    <div class="card-title">${photo.Title || 'Untitled'}</div>
                                    <div class="card-author">${photo.Photographer || 'Anonymous'}</div>
                                </div>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Gallery failed:", err);
                emptyState.style.display = 'block';
            }
        }

        // Category Filtering
        document.querySelectorAll('.cat-pill').forEach(pill => {
            pill.onclick = () => {
                document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                
                const cat = pill.innerText.toLowerCase();
                const cards = document.querySelectorAll('.photo-card');
                
                cards.forEach(card => {
                    if (cat === 'all') {
                        card.style.display = 'block';
                    } else {
                        const tags = (card.getAttribute('data-tags') || '').toLowerCase();
                        card.style.display = tags.includes(cat) ? 'block' : 'none';
                    }
                });
            };
        });

        function viewDetail(photo) {
            localStorage.setItem('pixelShareCurrentView', JSON.stringify(photo));
            window.location.href = "detail.html";
        }

        // Theme Toggle
        const savedTheme = localStorage.getItem('pixelShareTheme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);

        const themeToggle = document.getElementById('themeToggle');
        themeToggle.onclick = () => {
            const current = document.body.getAttribute('data-theme');
            const target = current === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', target);
            localStorage.setItem('pixelShareTheme', target);
        };

        // Search logic
        document.getElementById('searchInput').oninput = (e) => {
            const query = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.photo-card');
            cards.forEach(card => {
                const title = card.querySelector('.card-title').innerText.toLowerCase();
                card.style.display = title.includes(query) ? 'block' : 'none';
            });
        };

        loadGallery();
    </script>
</body>
</html>
